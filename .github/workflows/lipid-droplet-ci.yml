name: Lipid droplet regression CI

on:
  push:
    branches:
      - lipid-drop-imaging
  pull_request:
    branches:
      - lipid-drop-imaging
  workflow_dispatch:

jobs:
  hardware-free-regression:
    name: Hardware-free droplet regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out workspace and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install workspace test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./raman-mda-engine[testing]"
          python -m pip install -e "./cns-control[napari]"
          python -m pip install -e "./napari-raman-widget"
          # raman-mda-engine imports these at module load but does not yet
          # declare all of them in its package metadata. Install them explicitly
          # so this clean, hardware-free CI matches the microscope environment.
          python -m pip install pytest loguru requests opencv-python-headless scipy matplotlib tqdm

      - name: Compile changed acquisition modules
        run: |
          python -m py_compile \
            napari-raman-widget/napari_raman_widget/dry_run.py \
            napari-raman-widget/napari_raman_widget/field_help.py \
            napari-raman-widget/napari_raman_widget/unified_mda.py

      - name: Run hardware-free lipid regression suite
        working-directory: napari-raman-widget
        run: |
          python -m pytest \
            tests/test_lipid_droplet_autonomy.py \
            tests/test_dish_workflow.py \
            tests/test_galvo_voltage.py \
            -q
